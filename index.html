<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接続詞日記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: full-height two columns — editor with caret-anchored popup and character count on the left, connective list on the right */
:root{
  --bg:#F3F4F1; --paper:#FFFFFF; --fg:#1E2128; --muted:#636A75; --line:#DEE1DC;
  --accent:#2F5E58; --accent-soft:#E2EEEB; --warn:#A5561A; --warn-soft:#F7E9DC;
  --plus:#2B7856; --minus:#B03F35; --odd:#9A620E;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171A; --paper:#1C2024; --fg:#E4E7EA; --muted:#9BA2AB; --line:#2E343A;
  --accent:#7FC0B4; --accent-soft:#1F3330; --warn:#E5A266; --warn-soft:#3A2A1C;
  --plus:#6FC59C; --minus:#E88D83; --odd:#E2B465; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171A; --paper:#1C2024; --fg:#E4E7EA; --muted:#9BA2AB; --line:#2E343A;
  --accent:#7FC0B4; --accent-soft:#1F3330; --warn:#E5A266; --warn-soft:#3A2A1C;
  --plus:#6FC59C; --minus:#E88D83; --odd:#E2B465; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.6}
.wrap{max-width:1320px;margin:0 auto;height:100vh;height:100dvh;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{font-family:var(--serif);font-weight:700;font-size:20px;margin-right:auto}
.bar label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
input[type=date],select,button{font:inherit;font-size:13px;color:var(--fg);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0}
#ed,#mirror{font-family:var(--serif);font-size:17px;line-height:2;letter-spacing:.02em;padding:24px 28px 28px;width:100%;border:0;margin:0;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal}
#ed{display:block;flex:1 1 auto;min-height:0;height:100%;resize:none;overflow-y:auto;border-radius:8px;background:transparent;color:var(--fg);outline:none;}
#mirror{position:absolute;visibility:hidden;top:0;left:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;z-index:10;width:min(340px,calc(100% - 24px));background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.14);font-size:13.5px;overflow:hidden}
.pophead{padding:10px 12px 8px;border-bottom:1px solid var(--line);display:grid;gap:2px}
.pophead b{font-family:var(--serif);font-size:16px}
.meta{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.kochu{color:var(--accent);font-size:12px}
.pop ul{list-style:none;margin:0;padding:4px 0;max-height:260px;overflow-y:auto}
.pop li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 12px;cursor:pointer}
.pop li .cw{font-family:var(--serif);font-size:15px;font-weight:500}
.pop li .cr{grid-column:1/-1;color:var(--muted);font-size:11.5px}
.pop li[aria-selected="true"],.pop li:hover{background:var(--accent-soft)}
.tags{display:flex;gap:4px;align-items:center}
.tag{font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.t-プラス{color:var(--plus);border-color:currentColor}.t-マイナス{color:var(--minus);border-color:currentColor}.t-意外{color:var(--odd);border-color:currentColor}
.s-口語{border-style:dashed}.s-硬い{background:var(--fg);color:var(--paper);border-color:var(--fg)}
.pophint{padding:6px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px}
.empty{padding:10px 12px;color:var(--muted)}
.usage{display:grid;gap:8px}
.usage h2{font-size:13px;font-weight:500;color:var(--muted);margin:0;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}
.chip.many{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chip span{font-variant-numeric:tabular-nums;opacity:.75;margin-left:4px}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:12.5px}
.foot #status{margin-left:auto}
.wrap>*{min-width:0}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;min-height:0}
.left{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:12px;min-width:0;min-height:0}
.count{display:flex;align-items:baseline;gap:2px;justify-content:flex-end;color:var(--muted);font-size:13px;line-height:1.4}
.count b{font-size:18px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;margin-right:2px}
.count span{font-size:12px;margin-left:4px}
.dict{background:var(--paper);border:1px solid var(--line);border-radius:8px;min-height:0;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.dhead{padding:12px 16px 8px;font-weight:500;display:flex;gap:8px;align-items:baseline}
.dhead small{color:var(--muted);font-weight:400;font-size:12.5px}
.dtools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 16px 12px}
.gbtn{font-size:12px;padding:2px 9px 2px 7px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.gi{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.gbtn:not([aria-pressed="true"]) .gi{color:var(--accent)}
.gbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
#dq{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
.dbox{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;border-top:1px solid var(--line)}
.dict table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:13px}
.dict col.c1{width:42%}
.dict th,.dict td{text-align:left;padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.dict th{position:sticky;top:0;background:var(--paper);font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.05em;z-index:1}
.dict td.dw{font-family:var(--serif);font-size:15px;font-weight:500;line-height:1.4}
.dict .dg{display:block;font-family:var(--sans);font-size:11px;font-weight:400;color:var(--accent);margin-top:2px}
.dict .dr{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.dict .dm{display:block;font-size:13px;color:var(--fg);line-height:1.5;margin-bottom:3px}
.dict .dr{font-size:12px;color:var(--muted)}
.dict .dc{display:block;font-size:11.5px;color:var(--accent);margin-top:2px}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,42%);gap:12px}.foot{display:none}.wrap{gap:10px;padding-block:10px}
  .dnote{display:none}.dhead{padding:8px 12px 4px}.dtools{padding:0 12px 8px;gap:4px}.gbtn{font-size:11px;padding:1px 7px 1px 5px}
  .bar{gap:6px 8px}.brand{font-size:17px}.bar label{font-size:12px}.bar input,.bar select,.bar button{font-size:12px;padding:3px 7px}
  #ed,#mirror{padding:14px 16px;font-size:16px}}
.dict tbody tr{cursor:pointer}
.dict tbody tr:hover{background:var(--accent-soft)}
.dict tr.off{opacity:.4}
.dict tr.near{background:var(--accent-soft)}
.dict tr.cur td.dw{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.dnote{padding:8px 16px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
kbd{font-family:inherit;font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--paper)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="brand">接続詞日記</div>
    <label for="day">日付 <input type="date" id="day"></label>
    <label for="pref">候補の文体
      <select id="pref">
        <option value="all">すべて</option>
        <option value="casual">口語・中立のみ</option>
        <option value="formal">中立・硬いのみ</option>
      </select>
    </label>
    <button type="button" id="copy">本文をコピー</button>
    <button type="button" id="export">テキストで保存</button>
  </div>

  <div class="main">
  <div class="left">
  <div class="sheet" id="sheet">
    <div id="mirror" aria-hidden="true"></div>
    <textarea id="ed" spellcheck="false" aria-label="日記の本文"></textarea>
    <div class="pop" id="pop" hidden role="listbox" aria-label="言い換え候補"></div>
  </div>

  <div class="count" aria-live="polite"><b id="chars">0</b>文字<span>（改行を除く）</span></div>

  <div class="foot">
    <span><kbd>↓</kbd><kbd>Tab</kbd> 候補を選ぶ</span>
    <span><kbd>Enter</kbd> 置き換える</span>
    <span><kbd>Esc</kbd> 閉じる</span>
    <span><kbd>Alt</kbd>+<kbd>↓</kbd> カーソル直前の語の候補を表示</span>
    <span id="status"></span>
  </div>
  </div>

  <aside class="dict" id="dict" aria-label="接続詞の一覧">
    <div class="dhead">接続詞の一覧 <small id="dcount"></small></div>
    <div class="dtools">
      <div class="chips" id="dgroups"></div>
      <input type="search" id="dq" placeholder="語・論理関係で検索" aria-label="接続詞を検索">
    </div>
    <div class="dbox">
      <table>
        <colgroup><col class="c1"><col></colgroup>
        <thead><tr><th>語・グループ</th><th>意味・論理関係・トーン・文体</th></tr></thead>
        <tbody id="drows"></tbody>
      </table>
    </div>
    <div class="dnote">行をクリックするとカーソル位置に入力します。薄い行は「候補の文体」の設定で外れている語、色付きの行は入力中の語と同じグループです。</div>
  </aside>
  </div>
</div>

<script>

  state.match = match; state.list = candidates(match.entry); state.sel = -1; state.open = true;
  const e = match.entry;
  const aliasNote = match.key!==e.w ? `（${esc(e.w)}）` : "";
  pop.innerHTML = `<div class="pophead"><b>${esc(match.key)}${aliasNote}</b>
    <div class="meta"><span>${esc(e.g)} ／ ${esc(e.rel)}</span>${tags(e)}</div>
    ${e.c?`<div class="kochu">呼応：${esc(e.c)}</div>`:""}</div>
    ${state.list.length?`<ul>${state.list.map((x,i)=>`<li role="option" id="opt${i}" data-i="${i}" aria-selected="false"><span class="cw">${esc(x.w)}</span>${tags(x)}<span class="cr">${esc(x.rel)}${x.c?" ・ 呼応："+esc(x.c):""}</span></li>`).join("")}</ul>`
      :`<div class="empty">この文体の設定では候補がありません。</div>`}
    <div class="pophint">↓ / Tab で選択、Enter で置き換え、Esc で閉じる</div>`;
  pop.hidden = false;
  markDict(e);
  const r = caretRect(match.end);
  const sw = sheet.clientWidth, pw = pop.offsetWidth;
  pop.style.left = Math.max(12, Math.min(r.left - 20, sw - pw - 12)) + "px";
  // 下に入りきらないときはキャレットの上に出す
  const sh = sheet.clientHeight, ul = pop.querySelector("ul");
  if (ul) ul.style.maxHeight = Math.max(90, Math.min(260, sh - (pop.offsetHeight - ul.offsetHeight) - 16)) + "px";
  const ph = pop.offsetHeight;
  let top = r.top + r.lh;
  if (top + ph > sh - 8) top = (r.top - ph - 4 >= 8) ? r.top - ph - 4 : sh - ph - 8;
  pop.style.top = Math.max(8, Math.min(top, sh - ph - 8)) + "px";
}
function close(){ state.open=false; state.match=null; pop.hidden=true; }
function highlight(){
  pop.querySelectorAll("li").forEach((li,i)=>li.setAttribute("aria-selected", i===state.sel));
  const cur = pop.querySelector(`li[data-i="${state.sel}"]`);
  if (cur) cur.scrollIntoView({block:"nearest"});
}
function apply(i){
  const m = state.match, x = state.list[i]; if(!m||!x) return;
  ed.focus();
  ed.setSelectionRange(m.start, m.end);
  state.suppress = true;
  let ok = false;
  try { ok = document.execCommand("insertText", false, x.w); } catch(_) {}
  if (!ok){ ed.setRangeText(x.w, m.start, m.end, "end"); onChange(); }
  // 読点を挟んでいた場合はその後ろへ
  const after = m.start + x.w.length;
  const p = /[、，,]/.test(ed.value[after]||"") ? after+1 : after;
  ed.setSelectionRange(p,p);
  close();
}

/* ---------- 入力イベント ---------- */
function detect(){
  if (ed.selectionStart!==ed.selectionEnd){ close(); return; }
  const m = findBefore(ed.value, ed.selectionEnd);
  if (m && m.entry) open(m); else close();
}
ed.addEventListener("input", e=>{
  onChange();
  if (e.isComposing) return;
  if (state.suppress){ state.suppress=false; close(); return; }
  detect();
});
ed.addEventListener("compositionend", ()=>setTimeout(()=>{ if(!state.suppress) detect(); },0));
ed.addEventListener("keydown", e=>{
  if (e.isComposing || e.keyCode===229) return;
  if (e.altKey && e.key==="ArrowDown"){ e.preventDefault(); detect(); if(state.open){state.sel=0;highlight();} return; }
  if (!state.open) return;
  const n = state.list.length;
  if ((e.key==="ArrowDown" || (e.key==="Tab" && !e.shiftKey)) && n){ e.preventDefault(); state.sel=(state.sel+1)%n; highlight(); }
  else if ((e.key==="ArrowUp" || (e.key==="Tab" && e.shiftKey)) && n){ e.preventDefault(); state.sel = state.sel<=0 ? n-1 : state.sel-1; highlight(); }
  else if (e.key==="Enter"){ if (state.sel>=0){ e.preventDefault(); apply(state.sel); } else close(); }
  else if (e.key==="Escape"){ e.preventDefault(); close(); }
  else if (["ArrowLeft","ArrowRight","Home","End","PageUp","PageDown"].includes(e.key)) close();
});
pop.addEventListener("mousedown", e=>{ const li=e.target.closest("li"); if(li){ e.preventDefault(); apply(+li.dataset.i); } });
ed.addEventListener("blur", ()=>setTimeout(()=>{ if(document.activeElement!==ed) close(); },120));
ed.addEventListener("click", close);
ed.addEventListener("scroll", ()=>{ if(state.open) open(state.match); });
$("pref").addEventListener("change", ()=>{ store("pref",$("pref").value); renderDict(); if(state.open) open(state.match); });

/* ---------- 文字数 ---------- */
// 改行は数えない。絵文字なども1文字として数える
function updateCount(){
  const n = Array.from(ed.value.replace(/\r?\n/g,"")).length;
  $("chars").textContent = n.toLocaleString("ja-JP");
}

/* ---------- 保存 ---------- */
function load(k){ try{ return localStorage.getItem("tsunagi:"+k); }catch(_){ return null; } }
function store(k,v){ try{ localStorage.setItem("tsunagi:"+k,v); return true; }catch(_){ return false; } }
let timer=null;
function onChange(){
  updateCount();
  clearTimeout(timer);
  timer = setTimeout(()=>{
    const ok = store("day:"+$("day").value, ed.value);
    $("status").textContent = ok ? "自動保存しました" : "このブラウザでは自動保存できません。「テキストで保存」を使ってください";
  },400);
}
// タブを閉じる・再読み込みする直前にも保存する
window.addEventListener("pagehide", ()=>{ clearTimeout(timer); store("day:"+$("day").value, ed.value); });
function today(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function showDay(){
  const v = $("day").value;
  ed.value = load("day:"+v) || "";
  close(); updateCount(); $("status").textContent="";
}
$("day").addEventListener("change", ()=>{ if(!$("day").value) $("day").value=today(); showDay(); });
/* ---------- 一覧表 ---------- */
const GROUPS=["構成・転換","時間","順方向","掘り下げ","補足・制限","逆接・対比","選択・修正","評価・強調","否定呼応"];
const dict={g:null,q:"",cur:null};
// 絞り込みラベルのアイコン（16×16の線画）
const GICON={
  "すべて":'<rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/>',
  "構成・転換":'<path d="M6 4h7.5M6 8h7.5M6 12h7.5"/><path d="M2.75 4h.01M2.75 8h.01M2.75 12h.01" stroke-width="2.4"/>',
  "時間":'<circle cx="8" cy="8" r="5.75"/><path d="M8 4.75V8l2.25 1.5"/>',
  "順方向":'<path d="M2.5 8h10M9 4.5 12.5 8 9 11.5"/>',
  "掘り下げ":'<circle cx="7" cy="7" r="4.25"/><path d="m10.25 10.25 3.25 3.25"/>',
  "補足・制限":'<circle cx="8" cy="8" r="5.75"/><path d="M8 5.25v5.5M5.25 8h5.5"/>',
  "逆接・対比":'<path d="M2.5 5.5h10M10 3l2.5 2.5L10 8M13.5 10.5h-10M6 8l-2.5 2.5L6 13"/>',
  "選択・修正":'<path d="M10.5 2.75l2.75 2.75L6 12.75H3.25V10z"/>',
  "評価・強調":'<path d="M8 2.25l1.75 3.6 3.95.55-2.85 2.8.7 3.95L8 11.3l-3.55 1.85.7-3.95L2.3 6.4l3.95-.55z"/>',
  "否定呼応":'<circle cx="8" cy="8" r="5.75"/><path d="m4 12 8-8"/>'
};
const GDESC={
  "すべて":"すべての語を表示","構成・転換":"文章の順序や話題の切り替え（まず、さて など）","時間":"時の流れや場面（やがて、このとき など）",
  "順方向":"同じ向きに話を進める（そして、さらに、したがって など）","掘り下げ":"理由・例・言い換え・仮定・推量（つまり、たとえば など）",
  "補足・制限":"情報を添える、条件をつける（なお、ただし など）","逆接・対比":"話を反転させる、比べる（しかし、一方 など）",
  "選択・修正":"どちらかを選ぶ、言い直す（あるいは、むしろ など）","評価・強調":"気持ちや評価を添える（やはり、さいわい など）",
  "否定呼応":"後ろに打ち消しが来る（べつに〜ない など）"
};
const gicon=k=>`<svg class="gi" viewBox="0 0 16 16" aria-hidden="true">${GICON[k]||""}</svg>`;
function renderDict(){
  const gb=$("dgroups");
  gb.innerHTML=[null,...GROUPS].map(g=>{const k=g??"すべて";return `<button type="button" class="gbtn" data-g="${g??""}" aria-pressed="${dict.g===g}" title="${GDESC[k]}">${gicon(k)}<span>${k}</span></button>`;}).join("");
  const list=ENTRIES.filter(e=>(!dict.g||e.g===dict.g)&&(!dict.q||(e.w+e.rel+e.g+e.c+e.m).includes(dict.q)))
    .sort((a,b)=>GROUPS.indexOf(a.g)-GROUPS.indexOf(b.g)||a.i-b.i);
  $("dcount").textContent=`${list.length} / ${ENTRIES.length}語`;
  $("drows").innerHTML=list.map(e=>{
    const cls=[prefOk(e)?"":"off", dict.cur&&e.g===dict.cur.g?"near":"", dict.cur&&e.w===dict.cur.w?"cur":""].join(" ").trim();
    return `<tr data-w="${esc(e.w)}" class="${cls}"><td class="dw">${esc(e.w)}<span class="dg">${esc(e.g)}</span></td><td>${e.m?`<span class="dm">${esc(e.m)}</span>`:""}<div class="dr"><span>${esc(e.rel)}</span>${tags(e)}</div>${e.c?`<span class="dc">呼応：${esc(e.c)}</span>`:""}</td></tr>`;
  }).join("") || `<tr><td colspan="2" class="empty">該当する語がありません。</td></tr>`;
}
$("dgroups").addEventListener("click",e=>{ const b=e.target.closest(".gbtn"); if(!b) return; dict.g=b.dataset.g||null; renderDict(); });
$("dq").addEventListener("input",e=>{ dict.q=e.target.value.trim(); renderDict(); });
$("drows").addEventListener("click",e=>{
  const tr=e.target.closest("tr[data-w]"); if(!tr) return;
  ed.focus(); state.suppress=true;
  let ok=false; try{ ok=document.execCommand("insertText",false,tr.dataset.w); }catch(_){}
  if(!ok){ ed.setRangeText(tr.dataset.w, ed.selectionStart, ed.selectionEnd, "end"); state.suppress=false; onChange(); }
  close();
});
function markDict(entry){ const w=entry?entry.w:null; if((dict.cur&&dict.cur.w)===w) return; dict.cur=entry||null; renderDict();
  const row=$("drows").querySelector("tr.cur"), box=document.querySelector(".dbox");
  if(row && box) box.scrollTop=Math.max(0,row.offsetTop-box.clientHeight/3);
}

let copyTimer=null;
function copyFeedback(msg){
  const b=$("copy"); b.textContent=msg;
  clearTimeout(copyTimer); copyTimer=setTimeout(()=>{ b.textContent="本文をコピー"; },2000);
}
function copyFallback(){
  const s=ed.selectionStart, e=ed.selectionEnd;
  ed.focus(); ed.select();
  let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
  ed.setSelectionRange(s,e);
  copyFeedback(ok ? "コピーしました" : "コピーできませんでした");
}
$("copy").addEventListener("click", ()=>{
  if (!ed.value){ copyFeedback("本文が空です"); return; }
  close();
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(ed.value).then(()=>copyFeedback("コピーしました"), copyFallback);
  } else copyFallback();
});
$("export").addEventListener("click", ()=>{
  const blob = new Blob([ed.value],{type:"text/plain;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `日記_${$("day").value}.txt`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});

$("day").value = today();
$("pref").value = load("pref") || "all";
showDay();
renderDict();
ed.focus();
</script>
</body>
</html>
